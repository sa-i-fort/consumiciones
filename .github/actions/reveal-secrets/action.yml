name: Descifrar secretos con git-secret
description: >
  Instala git-secret (v0.5.0 fijado por commit), importa la clave GPG de CI y descifra
  lib/firebase_options.dart y android/app/google-services.json.

inputs:
  gpg-private-key:
    description: Clave privada GPG de CI (armored, codificada en base64). Viene del secret GPG_PRIVATE_KEY.
    required: true

runs:
  using: composite
  steps:
    - name: Instalar git-secret
      shell: bash
      run: |
        git clone --quiet https://github.com/sobolevn/git-secret.git "$RUNNER_TEMP/git-secret"
        git -C "$RUNNER_TEMP/git-secret" checkout --quiet 83e1e282f64367c5950dcb46ff39175b8abd1baa
        make -C "$RUNNER_TEMP/git-secret" build
        sudo make -C "$RUNNER_TEMP/git-secret" install PREFIX=/usr/local > /dev/null
        git secret --version

    - name: Importar clave de CI y descifrar
      shell: bash
      env:
        GPG_PRIVATE_KEY: ${{ inputs.gpg-private-key }}
      run: |
        # Acepta la clave en base64 (esperado, ~988 caracteres) o pegada tal cual en formato armored.
        # En base64 se ignoran espacios y saltos de línea (p. ej. \r de Windows al copiar).
        if printf '%s' "$GPG_PRIVATE_KEY" | grep -q 'BEGIN PGP PRIVATE KEY BLOCK'; then
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --quiet --import
        else
          if ! printf '%s' "$GPG_PRIVATE_KEY" | tr -d '[:space:]' | base64 -d 2> /dev/null | gpg --batch --quiet --import; then
            echo "::error::GPG_PRIVATE_KEY no es una clave válida (longitud recibida: ${#GPG_PRIVATE_KEY} caracteres; se esperan ~988 en base64). Vuelve a subirla pegando el contenido de saifort-ci-gpg-private.b64 sin comillas."
            exit 1
          fi
        fi
        git secret reveal -f
        test -s lib/firebase_options.dart
